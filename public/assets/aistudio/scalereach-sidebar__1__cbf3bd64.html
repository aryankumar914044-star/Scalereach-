<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scalereach – Sidebar</title>
<style>
:root{--bg:#070707;--side:#121212;--tx:#f1f1f1;--mut:#9a9a9a;--or:#f59e0b;--bl:#3b6ef0;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#070707}}
:root[data-theme="dark"]{--bg:#070707}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
html,body{height:100%}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
.app{position:relative;max-width:360px;height:100%;min-height:664px;margin:0 auto;overflow:hidden;background:#080808}
.side{position:absolute;left:0;top:0;bottom:0;width:269px;background:var(--side);border-right:1px solid #1d1d1d;display:flex;flex-direction:column;padding:15px 8px 0;overflow-y:auto;scrollbar-width:none}
svg.i{width:16px;height:16px;flex:none;fill:none;stroke:currentColor;stroke-width:1.6;stroke-linecap:round;stroke-linejoin:round}
.ws{display:flex;align-items:center;gap:8px;padding:0 8px 0 0;margin-left:0;height:32px;margin-bottom:21px;cursor:pointer;background:none;border:0;color:inherit;font:inherit;text-align:left;width:100%}
.logo{width:32px;height:32px;border-radius:8px;background:#1d4ed8;display:grid;place-items:center;flex:none}
.logo svg{width:16px;height:16px;stroke:#fff}
.nm{flex:1;line-height:1.15}
.nm b{display:block;font-weight:500;font-size:14px}
.nm span{font-size:12px}
.ws>svg,.me>svg{width:14px;height:14px;margin-right:4px}
.it{display:flex;align-items:center;gap:8px;height:34px;padding:0 8px 0 0;border:0;background:none;color:var(--tx);font:inherit;font-size:13.5px;width:100%;text-align:left;cursor:pointer;border-radius:8px}
.it svg.i{margin-left:0}
.it:hover,.it.on{background:#1b1b1b}
.it .t{flex:1}
.lab{height:20px;margin:29px 0 5px;color:var(--mut);font-size:13px;display:flex;align-items:center}
.gap{height:11px}
.min{color:var(--or)}
.pill{height:20px;padding:0 6px;border-radius:7px;font-size:12px;display:inline-flex;align-items:center;border:1px solid;line-height:1}
.pill.o{color:var(--or);border-color:#7a5208;background:#2b1e07}
.pill.g{color:#22c55e;border-color:#0e6b3a;background:#0a2a1a;font-size:11.5px}
.unlock{display:flex;align-items:center;gap:7px;height:49px;margin:6px 0 5px;padding:0 8px;border:1px solid #1f2c63;background:#0f1426;border-radius:14px;cursor:pointer;width:100%;color:inherit;font:inherit;text-align:left}
.unlock svg{stroke:var(--bl);width:16px;height:16px}
.unlock b{display:block;font-weight:400;font-size:13px;color:var(--bl);line-height:1.2}
.unlock span{font-size:12px;color:#a2a2a2}
.me{margin-top:auto;display:flex;align-items:center;gap:8px;height:32px;margin-bottom:13px;padding:0 8px 0 0;cursor:pointer;background:none;border:0;color:inherit;font:inherit;text-align:left;width:100%}
.av{width:32px;height:32px;border-radius:50%;background:#1d4ed8;display:grid;place-items:center;font-size:15px;flex:none;color:#fff}
.me .nm span{font-size:12px;color:#e8e8e8;white-space:nowrap}
.me .nm{min-width:0}
/* dimmed background page */
.bk{position:absolute;inset:0 0 0 269px;filter:blur(6px);opacity:.8}
.bk i{position:absolute;display:block;border-radius:10px}
.chat{position:absolute;right:24px;bottom:calc(46px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#1a6cf5;border:0;display:grid;place-items:center;cursor:pointer;z-index:3}
.chat svg{width:30px;height:30px;fill:#fff}
button:focus-visible{outline:2px solid #8aa6ff;outline-offset:-2px}
</style>
</head>
<body>
<svg width="0" height="0" style="position:absolute" aria-hidden="true">
<symbol id="bld" viewBox="0 0 24 24"><rect x="4" y="2" width="16" height="20" rx="2"/><path d="M9 22v-4h6v4M8 6h.01M12 6h.01M16 6h.01M8 10h.01M12 10h.01M16 10h.01M8 14h.01M12 14h.01M16 14h.01"/></symbol>
<symbol id="hom" viewBox="0 0 24 24"><path d="M3 10.5 12 3l9 7.5V20a1 1 0 0 1-1 1h-5v-6H9v6H4a1 1 0 0 1-1-1z"/></symbol>
<symbol id="dd" viewBox="0 0 24 24"><path d="m7 6 5 5 5-5M7 13l5 5 5-5"/></symbol>
<symbol id="cut" viewBox="0 0 24 24"><circle cx="6" cy="6" r="3"/><circle cx="6" cy="18" r="3"/><path d="M20 4 8.1 15.9M14.5 14.5 20 20M8.1 8.1 12 12"/></symbol>
<symbol id="star" viewBox="0 0 24 24"><polygon points="12 2 15.09 8.26 22 9.27 17 14.14 18.18 21.02 12 17.77 5.82 21.02 7 14.14 2 9.27 8.91 8.26 12 2"/></symbol>
<symbol id="roll" viewBox="0 0 24 24"><rect x="2" y="2" width="16" height="6" rx="2"/><path d="M10 16v-2a2 2 0 0 1 2-2h8a2 2 0 0 0 2-2V7a2 2 0 0 0-2-2h-2"/><rect x="8" y="16" width="4" height="6" rx="1"/></symbol>
<symbol id="shr" viewBox="0 0 24 24"><path d="M18 13v6a2 2 0 0 1-2 2H5a2 2 0 0 1-2-2V8a2 2 0 0 1 2-2h5"/><path d="M14 3h7v7M21 3l-9 9"/></symbol>
<symbol id="clk" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 6v6l4 2"/></symbol>
<symbol id="spk" viewBox="0 0 24 24"><path d="m14 3-1.6 5a2 2 0 0 1-1.4 1.4L6 11l5 1.6a2 2 0 0 1 1.4 1.4L14 19l1.6-5a2 2 0 0 1 1.4-1.4L22 11l-5-1.6A2 2 0 0 1 15.6 8z"/><path d="m6 14-.8 2.2L3 17l2.2.8L6 20l.8-2.2L9 17l-2.2-.8z"/></symbol>
<symbol id="gft" viewBox="0 0 24 24"><rect x="3" y="8" width="18" height="4" rx="1"/><path d="M12 8v13M19 12v7a2 2 0 0 1-2 2H7a2 2 0 0 1-2-2v-7"/><path d="M7.5 8a2.5 2.5 0 0 1 0-5C11 3 12 8 12 8s1-5 4.5-5a2.5 2.5 0 0 1 0 5"/></symbol>
<symbol id="key" viewBox="0 0 24 24"><circle cx="7.5" cy="15.5" r="5.5"/><path d="m21 2-9.6 9.6M15.5 7.5l3 3L22 7l-3-3"/></symbol>
<symbol id="cog" viewBox="0 0 24 24"><path d="M12.2 2h-.4a2 2 0 0 0-2 2v.2a2 2 0 0 1-1 1.7l-.4.3a2 2 0 0 1-2 0l-.2-.1a2 2 0 0 0-2.7.7l-.2.4a2 2 0 0 0 .7 2.7l.2.1a2 2 0 0 1 1 1.7v.5a2 2 0 0 1-1 1.7l-.2.1a2 2 0 0 0-.7 2.7l.2.4a2 2 0 0 0 2.7.7l.2-.1a2 2 0 0 1 2 0l.4.3a2 2 0 0 1 1 1.7v.2a2 2 0 0 0 2 2h.4a2 2 0 0 0 2-2v-.2a2 2 0 0 1 1-1.7l.4-.3a2 2 0 0 1 2 0l.2.1a2 2 0 0 0 2.7-.7l.2-.4a2 2 0 0 0-.7-2.7l-.2-.1a2 2 0 0 1-1-1.7v-.5a2 2 0 0 1 1-1.7l.2-.1a2 2 0 0 0 .7-2.7l-.2-.4a2 2 0 0 0-2.7-.7l-.2.1a2 2 0 0 1-2 0l-.4-.3a2 2 0 0 1-1-1.7V4a2 2 0 0 0-2-2z"/><circle cx="12" cy="12" r="3"/></symbol>
<symbol id="kbd" viewBox="0 0 24 24"><rect x="2" y="8" width="20" height="13" rx="2"/><path d="M12 8V4M9 4h6M6 12h.01M10 12h.01M14 12h.01M18 12h.01M8 17h8"/></symbol>
<symbol id="hlp" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M9.1 9a3 3 0 0 1 5.8 1c0 2-3 3-3 3M12 17h.01"/></symbol>
<symbol id="alr" viewBox="0 0 24 24"><circle cx="12" cy="12" r="10"/><path d="M12 8v4M12 16h.01"/></symbol>
</svg>

<div class="app">
  <div class="bk" aria-hidden="true">
    <i style="right:10px;top:20px;width:34px;height:14px;background:#2a2a2a"></i>
    <i style="right:0;top:62px;width:66px;height:30px;background:#6b4a08"></i>
    <i style="left:0;top:130px;width:130px;height:62px;background:#161616"></i>
    <i style="left:0;top:120px;width:40px;height:6px;background:#1e3a8a"></i>
    <i style="left:0;top:170px;width:34px;height:6px;background:#1e3a8a"></i>
    <i style="left:0;top:230px;width:78px;height:42px;background:#141414"></i>
    <i style="left:0;top:296px;width:55px;height:6px;background:#6b4a08"></i>
    <i style="left:0;top:322px;width:56px;height:40px;background:#2f55d6"></i>
    <i style="left:0;top:540px;width:50px;height:6px;background:#333"></i>
    <i style="left:0;top:575px;width:80px;height:110px;background:linear-gradient(135deg,#6a5a4a,#a02a2a,#2a4a7a)"></i>
  </div>

  <nav class="side" aria-label="Sidebar">
    <button class="ws" type="button">
      <span class="logo"><svg class="i"><use href="#bld"/></svg></span>
      <span class="nm"><b>Panda's</b><span>Owner</span></span>
      <svg class="i"><use href="#dd"/></svg>
    </button>

    <button class="it" type="button"><svg class="i"><use href="#hom"/></svg><span class="t">Home</span></button>
    <button class="it" type="button"><svg class="i"><use href="#cut"/></svg><span class="t">All Clips</span></button>
    <button class="it" type="button"><svg class="i"><use href="#star"/></svg><span class="t">Favorites</span></button>

    <div class="lab">Tools</div>
    <button class="it" type="button"><svg class="i"><use href="#roll"/></svg><span class="t">Brand Templates</span></button>
    <button class="it" type="button"><svg class="i"><use href="#shr"/></svg><span class="t">Social Scheduler</span></button>
    <button class="it" type="button"><svg class="i"><use href="#clk"/></svg><span class="t">Minute Usage</span></button>

    <div class="gap"></div>
    <button class="it min" type="button"><svg class="i"><use href="#clk"/></svg><span class="t">Minutes</span><span class="pill o">0 min</span></button>
    <button class="unlock" type="button"><svg class="i"><use href="#spk"/></svg><span><b>Unlock more minutes</b><span>400 min/month, no watermark</span></span></button>

    <button class="it" type="button"><svg class="i"><use href="#gft"/></svg><span class="t">Affiliate</span><span class="pill g">New</span></button>
    <button class="it" type="button"><svg class="i"><use href="#key"/></svg><span class="t">API Keys</span></button>
    <button class="it" type="button"><svg class="i"><use href="#cog"/></svg><span class="t">Settings</span></button>
    <button class="it" type="button"><svg class="i"><use href="#kbd"/></svg><span class="t">Shortcuts</span></button>
    <button class="it" type="button"><svg class="i"><use href="#hlp"/></svg><span class="t">Get Help</span></button>
    <button class="it" type="button"><svg class="i"><use href="#alr"/></svg><span class="t">Report Issue</span></button>

    <button class="me" type="button">
      <span class="av">P</span>
      <span class="nm"><b>Panda Kumar</b><span>pandakumar8752@gmail.com</span></span>
      <svg class="i"><use href="#dd"/></svg>
    </button>
  </nav>

  <button class="chat" type="button" aria-label="Chat support">
    <svg viewBox="0 0 24 24"><path d="M3 4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6l-3 4v-4H5a2 2 0 0 1-2-2z"/></svg>
  </button>
</div>
<script>
document.querySelectorAll('.it').forEach(function(b){b.addEventListener('click',function(){document.querySelectorAll('.it').forEach(function(x){x.classList.remove('on')});b.classList.add('on');});});
</script>
</body>
</html>
