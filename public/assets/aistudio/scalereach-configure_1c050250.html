<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<title>Scalereach – Configure</title>
<style>
:root{--bg:#0a0a0a;--card:#121212;--bd:#262626;--tx:#f2f2f2;--mut:#9d9d9d;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}
@media (prefers-color-scheme:dark){:root:not([data-theme="light"]){--bg:#0a0a0a}}
:root[data-theme="dark"]{--bg:#0a0a0a}
*{box-sizing:border-box}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
body{margin:0;background:var(--bg);color:var(--tx);font-family:Inter,Roboto,system-ui,-apple-system,"Segoe UI",sans-serif;-webkit-font-smoothing:antialiased}
.app{max-width:360px;min-height:100vh;margin:0 auto;position:relative}
.bar{position:sticky;top:env(safe-area-inset-top,0px);z-index:5;height:47px;background:#0c0c0c;border-bottom:1px solid #1d1d1d;display:flex;align-items:center;padding-right:16px}
.tg{width:27px;height:27px;margin-left:12px;border-radius:8px;border:1px solid #343434;background:#161616;display:grid;place-items:center;color:var(--tx);padding:0;cursor:pointer}
.tg svg{width:14px;height:14px}
.dv{width:1px;align-self:stretch;margin-left:12px;background:#222}
.crumb{display:flex;align-items:center;gap:10px;margin-left:13px;font-size:13.5px;color:var(--mut);flex:1}
.crumb svg{width:10px;height:10px}
.crumb b{font-weight:400;color:#fff}
.free{height:20px;padding:0 6px;border-radius:8px;border:1px solid #3a3a3a;background:#1a1a1a;font-size:12px;display:flex;align-items:center;color:#eee}
svg.s{fill:none;stroke:currentColor;stroke-width:1.7;stroke-linecap:round;stroke-linejoin:round}
.back{display:flex;align-items:center;gap:13px;margin:29px 0 0 30px;height:24px;background:none;border:0;color:var(--tx);font:inherit;font-size:14px;padding:0;cursor:pointer}
.back svg{width:14px;height:14px}
.c1{margin:21px 16px 0;border:1px solid var(--bd);background:var(--card);border-radius:20px;padding:16px 17px 17px}
.lbl{display:flex;align-items:center;gap:8px;height:20px;font-size:14px}
.yt{width:16px;height:11px;background:#f00;border-radius:3px;position:relative;flex:none}
.yt:after{content:"";position:absolute;left:6px;top:2.5px;border-left:5px solid #fff;border-top:3px solid transparent;border-bottom:3px solid transparent}
.in{display:flex;align-items:center;gap:8px;height:39px;margin-top:13px;border:1px solid #3a3a3a;background:#151515;border-radius:12px;padding:0 12px 0 11px}
.in input{flex:1;min-width:0;border:0;outline:0;background:none;color:#fff;font:inherit;font-size:14px}
.sp{width:14px;height:14px;border-radius:50%;border:1.6px solid #4a4a4a;border-top-color:#a8a8a8;animation:r .9s linear infinite;flex:none}
@keyframes r{to{transform:rotate(360deg)}}
@media (prefers-reduced-motion:reduce){.sp{animation:none}}
.c2{margin:25px 16px 0;height:275px;border:1px dashed #2c2c2c;background:var(--card);border-radius:20px;display:flex;flex-direction:column;align-items:center;justify-content:center}
.tile{width:47px;height:47px;border-radius:16px;background:#141a2a;display:grid;place-items:center}
.tile .yt{width:24px;height:16px;border-radius:5px}
.tile .yt:after{left:9px;top:4px;border-left:7px solid #fff;border-top:4px solid transparent;border-bottom:4px solid transparent}
.pm{margin:14px 0 0;font-size:13.5px;line-height:20px;color:#b8b8b8;text-align:center;padding:0 8px}
.ww{display:flex;align-items:center;gap:8px;margin-top:17px;height:18px;font-size:12px;color:#a9a9a9}
.ww .yt{width:14px;height:10px}
.ic{align-self:stretch;display:flex;align-items:center;gap:4px;margin:10px 0 0 18px;height:14px}
.ic svg{width:14px;height:14px;fill:#777;flex:none}
.ex{align-self:stretch;margin:7px 0 0 17px;font-size:12.5px;color:#8c8c8c;line-height:16px}
.chat{position:fixed;right:max(24px,calc(50% - 156px));bottom:calc(19px + env(safe-area-inset-bottom,0px));width:54px;height:54px;border-radius:50%;background:#1a6cf5;border:0;display:grid;place-items:center;cursor:pointer;z-index:9}
.chat svg{width:30px;height:30px;fill:#fff}
button:focus-visible,input:focus-visible{outline:2px solid #8aa6ff;outline-offset:2px}
</style>
</head>
<body>
<div class="app">
  <header class="bar">
    <button class="tg" type="button" aria-label="Toggle sidebar"><svg class="s" viewBox="0 0 24 24"><rect x="3" y="3" width="18" height="18" rx="3"/><path d="M9 3v18"/></svg></button>
    <span class="dv"></span>
    <div class="crumb"><span>Dashboard</span><svg class="s" viewBox="0 0 24 24"><path d="m9 5 7 7-7 7"/></svg><b>Configure</b></div>
    <span class="free">Free</span>
  </header>

  <button class="back" type="button"><svg class="s" viewBox="0 0 24 24"><path d="M19 12H5M12 19l-7-7 7-7"/></svg>Back</button>

  <section class="c1">
    <div class="lbl"><span class="yt"></span>YouTube URL</div>
    <div class="in">
      <input type="text" value="https://youtu.be/gabghul30io?si=Fx2kQ9" aria-label="YouTube URL">
      <span class="sp" aria-hidden="true"></span>
    </div>
  </section>

  <section class="c2">
    <div class="tile"><span class="yt"></span></div>
    <p class="pm">Paste a video link to configure your clips</p>
    <div class="ww">Works with <span class="yt"></span></div>
    <div class="ic" aria-hidden="true">
      <svg viewBox="0 0 12 12"><path d="M3 5V4a3 3 0 0 1 6 0v1h1v6H2V5zm1 0h4V4a2 2 0 0 0-4 0z"/></svg>
      <svg viewBox="0 0 12 12"><path d="M1 1h10v7H7l-2 3V8H1z"/></svg>
      <svg viewBox="0 0 12 12"><path d="M2 1h2v4l4-4h2.5L6 6l5 5H8.5L4 6.5V11H2z"/></svg>
      <svg viewBox="0 0 12 12"><path d="M4 1h4l4 7-2 3H2L0 8z"/></svg>
      <svg viewBox="0 0 12 12"><path d="M3 1 6 3 3 5 0 3zM9 1l3 2-3 2-3-2zM3 7l3 2-3 2-3-2zM9 7l3 2-3 2-3-2z"/></svg>
      <svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="2"/><path d="M5.5 0h1v2.5h-1zM5.5 9.5h1V12h-1zM0 5.5h2.5v1H0zM9.5 5.5H12v1H9.5z"/></svg>
      <svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="6"/></svg>
      <svg viewBox="0 0 12 12"><path d="M2 2h5a3 3 0 0 1 0 6H4v3H2z"/></svg>
      <svg viewBox="0 0 12 12"><circle cx="6" cy="6" r="6"/></svg>
      <svg viewBox="0 0 12 12"><path d="M1 3h10v2H1zM1 7h10v2H1z"/></svg>
      <svg viewBox="0 0 12 12"><circle cx="6" cy="7" r="4"/></svg>
    </div>
    <div class="ex">+ .mp4/.mov links</div>
  </section>
</div>
<button class="chat" type="button" aria-label="Chat support"><svg viewBox="0 0 24 24"><path d="M3 4a2 2 0 0 1 2-2h14a2 2 0 0 1 2 2v10a2 2 0 0 1-2 2h-6l-3 4v-4H5a2 2 0 0 1-2-2z"/></svg></button>
</body>
</html>
