<!DOCTYPE html>
<html lang="en">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Sign in</title>
<style>
  :root {
    --bg: #0a0a0a;
    --field: #141414;
    --border: #2e2e32;
    --text: #f5f5f5;
    --muted: #8d8d94;
    --primary: #2f56d6;
    --primary-hover: #3b65ee;
    --link: #3b6ef5;
    --error: #ff6b6b;
  }
  * { box-sizing: border-box; margin: 0; padding: 0; }
  body {
    min-height: 100vh;
    background: var(--bg);
    color: var(--text);
    font-family: Inter, system-ui, -apple-system, "Segoe UI", Roboto, sans-serif;
    display: flex;
    align-items: center;
    justify-content: center;
    padding: 24px;
  }
  .card { width: 100%; max-width: 400px; }
  .logo {
    width: 48px; height: 48px; margin: 0 auto 28px;
    border-radius: 12px;
    background: linear-gradient(145deg, #3d63e0, #2a49b8);
    display: grid; place-items: center;
  }
  .logo svg { width: 26px; height: 26px; }
  h1 { text-align: center; font-size: 2rem; font-weight: 700; letter-spacing: -0.03em; }
  .sub { text-align: center; color: var(--muted); margin: 10px 0 32px; font-size: 1.05rem; }
  label { display: block; font-size: 0.95rem; margin-bottom: 8px; }
  .field { margin-bottom: 20px; }
  input[type="text"], input[type="password"] {
    width: 100%; height: 50px; padding: 0 16px;
    background: var(--field); color: var(--text);
    border: 1px solid var(--border); border-radius: 10px;
    font: inherit; font-size: 1rem;
    transition: border-color .15s, box-shadow .15s;
  }
  input::placeholder { color: #77777e; }
  input:focus { outline: none; border-color: #6a6a72; box-shadow: 0 0 0 3px rgba(255,255,255,.12); }
  .pw { display: flex; gap: 8px; }
  .toggle {
    width: 50px; height: 50px; flex: none;
    background: var(--field); border: 1px solid var(--border); border-radius: 10px;
    color: var(--text); cursor: pointer; display: grid; place-items: center;
  }
  .toggle:focus-visible, button:focus-visible, a:focus-visible { outline: 2px solid var(--link); outline-offset: 2px; }
  .row { display: flex; justify-content: space-between; align-items: center; margin: 4px 0 24px; font-size: 0.95rem; }
  .remember { display: flex; align-items: center; gap: 10px; cursor: pointer; margin: 0; }
  .remember input {
    appearance: none; width: 22px; height: 22px;
    background: var(--field); border: 1px solid var(--border); border-radius: 6px;
    cursor: pointer; display: grid; place-items: center;
  }
  .remember input:checked { background: var(--primary); border-color: var(--primary); }
  .remember input:checked::after { content: ""; width: 6px; height: 11px; border: solid #fff; border-width: 0 2px 2px 0; transform: rotate(45deg) translate(-1px,-1px); }
  .row a { color: var(--muted); text-decoration: none; }
  .row a:hover { color: var(--text); }
  .btn {
    width: 100%; height: 50px; border-radius: 10px; font: inherit; font-size: 1rem; cursor: pointer;
    display: flex; align-items: center; justify-content: center; gap: 12px;
  }
  .btn-primary {
    background: var(--primary); color: #fff; border: 1px solid #4a6fe6; font-weight: 500;
    box-shadow: 0 4px 18px rgba(47,86,214,.35);
  }
  .btn-primary:hover { background: var(--primary-hover); }
  .btn-primary:disabled { opacity: .6; cursor: wait; }
  .btn-google { background: var(--field); color: var(--text); border: 1px solid var(--border); }
  .btn-google:hover { background: #1c1c1f; }
  .or { display: flex; align-items: center; gap: 16px; color: var(--muted); margin: 18px 0; font-size: 0.95rem; }
  .or::before, .or::after { content: ""; flex: 1; height: 1px; background: var(--border); }
  .signup { text-align: center; color: var(--muted); margin-top: 32px; }
  .signup a, .legal a { color: var(--link); text-decoration: none; }
  .signup a:hover { text-decoration: underline; }
  .legal { text-align: center; color: #6b6b72; font-size: 0.85rem; line-height: 1.6; margin-top: 28px; }
  .legal a { color: #9a9aa2; text-decoration: underline; }
  .error { color: var(--error); font-size: 0.9rem; margin: -8px 0 16px; min-height: 1.2em; }
</style>
</head>
<body>
  <main class="card">
    <div class="logo" aria-hidden="true">
      <svg viewBox="0 0 24 24" fill="none"><path d="M13 2 5 13h6l-1 9 9-12h-6l0-8Z" fill="#fff" fill-opacity=".85"/></svg>
    </div>
    <h1>Welcome back</h1>
    <p class="sub">Sign in to your account to continue</p>

    <form id="loginForm" novalidate>
      <div class="field">
        <label for="identity">Email or Username</label>
        <input id="identity" name="identity" type="text" placeholder="you@example.com or username" autocomplete="username" required>
      </div>

      <div class="field">
        <label for="password">Password</label>
        <div class="pw">
          <input id="password" name="password" type="password" placeholder="Enter your password" autocomplete="current-password" required>
          <button type="button" class="toggle" id="toggle" aria-label="Show password">
            <svg width="22" height="22" viewBox="0 0 24 24" fill="none" stroke="currentColor" stroke-width="2" stroke-linecap="round" stroke-linejoin="round"><path d="M2 12s3.5-7 10-7 10 7 10 7-3.5 7-10 7S2 12 2 12Z"/><circle cx="12" cy="12" r="3"/></svg>
          </button>
        </div>
      </div>

      <div class="row">
        <label class="remember"><input type="checkbox" id="remember"> Remember me</label>
        <a href="/forgot-password">Forgot password?</a>
      </div>

      <p class="error" id="error" role="alert"></p>

      <button type="submit" class="btn btn-primary" id="submit">Sign in</button>
    </form>

    <div class="or">OR</div>

    <button type="button" class="btn btn-google" id="google">
      <svg width="20" height="20" viewBox="0 0 48 48" aria-hidden="true"><path fill="#EA4335" d="M24 9.5c3.5 0 6.6 1.2 9.1 3.6l6.8-6.8C35.8 2.4 30.3 0 24 0 14.6 0 6.5 5.4 2.6 13.2l7.9 6.1C12.4 13.6 17.7 9.5 24 9.5z"/><path fill="#4285F4" d="M46.5 24.5c0-1.6-.1-3.1-.4-4.5H24v9h12.7c-.6 3-2.3 5.5-4.8 7.2l7.6 5.9c4.4-4.1 7-10.1 7-17.6z"/><path fill="#FBBC05" d="M10.5 28.7c-.5-1.4-.8-3-.8-4.7s.3-3.2.8-4.7l-7.9-6.1C.9 16.4 0 20.1 0 24s.9 7.6 2.6 10.8l7.9-6.1z"/><path fill="#34A853" d="M24 48c6.5 0 11.9-2.1 15.9-5.8l-7.6-5.9c-2.1 1.4-4.9 2.3-8.3 2.3-6.3 0-11.6-4.1-13.5-9.8l-7.9 6.1C6.5 42.6 14.6 48 24 48z"/></svg>
      Sign in with Google
    </button>

    <p class="signup">Don't have an account? <a href="/signup">Sign up</a></p>

    <p class="legal">By proceeding you acknowledge that you have read, understood and agree to our
      <a href="/terms">Terms and Conditions</a>, <a href="/privacy">Privacy Policy</a>, <a href="/affiliate">Affiliate Agreement</a></p>
  </main>

<script>
  const form = document.getElementById('loginForm');
  const pw = document.getElementById('password');
  const err = document.getElementById('error');
  const btn = document.getElementById('submit');

  // Show / hide password
  document.getElementById('toggle').addEventListener('click', () => {
    const show = pw.type === 'password';
    pw.type = show ? 'text' : 'password';
    document.getElementById('toggle').setAttribute('aria-label', show ? 'Hide password' : 'Show password');
  });

  // Email/username + password login
  form.addEventListener('submit', async (e) => {
    e.preventDefault();
    err.textContent = '';
    const identity = form.identity.value.trim();
    const password = pw.value;
    if (!identity || !password) {
      err.textContent = 'Enter your email or username and password.';
      return;
    }
    btn.disabled = true;
    btn.textContent = 'Signing in...';
    try {
      // TODO: apni backend API ka URL yahan daalo
      const res = await fetch('/api/login', {
        method: 'POST',
        headers: { 'Content-Type': 'application/json' },
        body: JSON.stringify({ identity, password, remember: document.getElementById('remember').checked })
      });
      if (!res.ok) throw new Error('Incorrect email/username or password.');
      window.location.href = '/dashboard';
    } catch (ex) {
      err.textContent = ex.message || 'Could not sign in. Try again.';
    } finally {
      btn.disabled = false;
      btn.textContent = 'Sign in';
    }
  });

  // Google sign-in: apne backend ka OAuth route yahan connect karo
  document.getElementById('google').addEventListener('click', () => {
    window.location.href = '/auth/google';
  });
</script>
</body>
</html>
